<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AuxeRef Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 270px;
      margin: 0;
      padding: 14px;
      background: #2b2b2b;
      color: #eaeaea;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #eb7814;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-box {
      background: #1e1e1e;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #3c3c3c;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ecc71;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 6px #2ecc71;
    }
    .instructions {
      font-size: 12px;
      line-height: 1.5;
      color: #bbb;
      margin-bottom: 12px;
    }
    .footer {
      margin-top: 10px;
      font-size: 11px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>
    <img src="icons/icon16.png" alt="icon">
    AuxeRef Bridge
  </h2>

  <div class="status-box">
    <div class="status-row">
      <span>Native Bridge:</span>
      <span><span class="indicator"></span> Active</span>
    </div>
  </div>

  <div class="instructions">
    Right-click <b>any image</b> on Pinterest or Google Images:
    <br><br>
    <b>AuxeRef ➔</b>
    <ul style="margin: 4px 0 0 0; padding-left: 18px;">
      <li><b>Open in Blender:</b> Immediate spawn</li>
      <li><b>Add to Quick:</b> Save to quick palette</li>
    </ul>
  </div>

  <div class="footer">
    AuxeRef Native IPC • No ports needed
  </div>
</body>
</html>
